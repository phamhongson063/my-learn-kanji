<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Kanji — Bài Giảng</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans:wght@300;400;600;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="page-nav">
  <a href="../index.html" class="nav-back">← Danh sách</a>
  <span id="d-nav-char" class="nav-char"></span>
  <span id="d-nav-info" class="nav-title"></span>
</nav>

<!-- HERO -->
<div class="hero" id="d-hero"></div>

<!-- MAIN CONTENT — rendered by JS -->
<div class="wrap">
  <div id="d-sections"></div>

  <!-- LUYỆN VIẾT — static canvas, text from JSON -->
  <div class="section" id="s7">
    <div class="sec-label">Phần 07</div>
    <div class="sec-title">Luyện Viết</div>
    <p id="d-practice-hint"></p>

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin:24px 0">
      <div style="position:relative;width:100%;max-width:480px;padding-bottom:min(480px,100%);height:0;border:1.5px solid var(--border);border-radius:6px;overflow:hidden;background:#fff;">
        <canvas id="ghost-canvas" width="400" height="400" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>
        <canvas id="draw-canvas"  width="400" height="400" style="position:absolute;top:0;left:0;width:100%;height:100%;cursor:crosshair;touch-action:none;z-index:1;"></canvas>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
        <button class="btn" onclick="clearDraw()" style="background:var(--surface);color:var(--gold);border:1.5px solid var(--border);">🗑 Xoá</button>
        <button class="btn" onclick="undoDraw()"  style="background:var(--surface);color:var(--muted);border:1.5px solid var(--border);">↩ Hoàn tác</button>
        <button class="btn" onclick="toggleGhost()" id="btn-ghost" style="background:var(--surface);color:var(--muted);border:1.5px solid var(--border);">👁 Ẩn chữ mờ</button>
        <button class="btn" onclick="setInkColor('#b83232')" id="btn-red" style="background:#b83232;color:#fff;border-color:#b83232;">✒ Đỏ</button>
        <button class="btn" onclick="setBrushSize(11)" id="btn-thick" style="background:var(--surface);color:var(--muted);border:1.5px solid var(--border);letter-spacing:0">— Đậm</button>
      </div>
    </div>
  </div>

  <!-- KIỂM TRA — rendered by JS -->
  <div class="section" id="s8">
    <div class="sec-label">Phần 08</div>
    <div class="sec-title">Kiểm Tra Kiến Thức</div>
    <div id="d-quiz"></div>
  </div>
</div>

<!-- FOOTER -->
<footer id="d-footer" class="page-footer" style="background:var(--surface);border-top:1px solid var(--border);text-align:center;padding:36px 20px 28px"></footer>

<!-- WIDGET TỰ ĐỘNG VẼ -->
<div id="anim-widget" style="display:none;position:fixed;bottom:0;right:0;z-index:999;width:120px;height:120px;border-radius:10px 0 0 0;overflow:hidden;box-shadow:-3px -3px 16px rgba(100,78,30,0.18);">
  <div id="auto-writer" style="position:absolute;inset:0;background:#fff;background-image:linear-gradient(rgba(138,98,24,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(138,98,24,0.07) 1px,transparent 1px);background-size:50% 50%;"></div>
  <button onclick="hideWidget()" title="Đóng" style="position:absolute;top:5px;left:5px;z-index:10;background:rgba(244,239,230,0.85);border:none;border-radius:50%;width:18px;height:18px;font-size:9px;color:var(--muted);cursor:pointer;line-height:18px;text-align:center;padding:0;">✕</button>
</div>

<script src="../js/kanji-detail.js"></script>
</body>
</html>
