      /* ════════════════════════════════
   GAME LOGIC
   ════════════════════════════════ */
      const AUDIO_BASE = "../db/audio/";
      const MAX_LIVES = 3;
      const SPAWN_INTERVAL_INIT = 3200;
      const SPAWN_INTERVAL_MIN = 1200;
      const BASE_SPEED_INIT = 12;
      const BASE_SPEED_MAX = 80;
      const ROUND_SIZE = 12;

      let allWords = [];
      let queue = [];
      let falling = [];
      let score = 0;
      let lives = MAX_LIVES;
      let gameRunning = false;

      const bgAudio = new Audio("../asset/audio/bg_audio_1.mp3");
      bgAudio.loop = true;
      bgAudio.volume = 0.4;

      const BG_AUDIO_KEY = "fallingVocab_bgAudio";
      let bgMuted = localStorage.getItem(BG_AUDIO_KEY) === "false";

      const SVG_SOUND_ON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
      const SVG_SOUND_OFF = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`;

      function updateAudioBtn() {
        const btn = document.getElementById("audio-btn");
        if (!btn) return;
        btn.innerHTML = bgMuted ? SVG_SOUND_OFF : SVG_SOUND_ON;
        btn.classList.toggle("muted", bgMuted);
      }

      function toggleBgAudio() {
        bgMuted = !bgMuted;
        localStorage.setItem(BG_AUDIO_KEY, bgMuted ? "false" : "true");
        if (bgMuted) {
          bgAudio.pause();
        } else {
          bgAudio.play().catch(() => {});
        }
        updateAudioBtn();
      }

      function bgPlay() {
        if (!bgMuted) bgAudio.play().catch(() => {});
      }
      function bgStop() {
        bgAudio.pause();
        bgAudio.currentTime = 0;
      }

      updateAudioBtn();
      let lastTime = null;
      let spawnTimer = 0;
      let spawnInterval = SPAWN_INTERVAL_INIT;
      let baseSpeed = BASE_SPEED_INIT;
      let rafId = null;

      let round = 1;
      let wordsSpawnedThisRound = 0;
      let wordsCaughtThisRound = 0;
      let wrongWords = [];

      let buildSelected = [];
      let buildTarget = "";

      let missPopupOpen = false;

      const gameArea = document.getElementById("game-area");
      const navEl = document.getElementById("g-nav");
      const scoreEl = document.getElementById("score-display");
      const livesEl = document.getElementById("lives-display");
      const roundLabelEl = document.getElementById("round-label");
      const bgLayer = document.getElementById("bg-layer");
      const choiceBarEl = document.getElementById("choice-bar");
      const buildBarEl = document.getElementById("build-bar");
      const overlayStart = document.getElementById("overlay-start");
      const overlayGameover = document.getElementById("overlay-gameover");
      const overlayRound = document.getElementById("overlay-round");
      const finalScoreEl = document.getElementById("final-score");
      const missPopupEl = document.getElementById("miss-popup");
      const missKanjiEl = document.getElementById("miss-kanji");
      const missReadingEl = document.getElementById("miss-reading");
      const missRomajiEl = document.getElementById("miss-romaji");
      const missMeaningEl = document.getElementById("miss-meaning");
      const timerFill = document.getElementById("round-progress-fill");
      const buildTilesEl = document.getElementById("build-tiles");
      const buildSelectedEl = document.getElementById("build-selected");
      const buildDisplayEl = document.getElementById("build-display");
      const choiceBtns = [0, 1, 2].map((i) =>
        document.getElementById("choice-" + i)
      );
      const roundDoneNumEl = document.getElementById("round-done-num");
      const roundNextNumEl = document.getElementById("round-next-num");
      const roundScoreEl = document.getElementById("round-score");
      const roundWrongHintEl = document.getElementById("round-wrong-hint");

      async function loadWords() {
        try {
          const res = await fetch(AUDIO_BASE + "index.json");
          allWords = await res.json();
        } catch (e) {
          console.error("Không tải được từ vựng:", e);
        }
      }

      function showStart() {
        gameRunning = false;
        if (rafId) cancelAnimationFrame(rafId);
        falling.forEach((f) => f.el.remove());
        falling = [];
        clearChoices();
        roundLabelEl.textContent = "";
        timerFill.style.width = "0%";
        overlayStart.style.display = "flex";
        overlayGameover.style.display = "none";
        overlayRound.style.display = "none";
        bgStop();
      }

      async function startGame() {
        if (!allWords.length) await loadWords();
        bgPlay();

        applyTheme(randomTheme());

        score = 0;
        lives = MAX_LIVES;
        round = 1;
        wrongWords = [];
        wordsSpawnedThisRound = 0;
        wordsCaughtThisRound = 0;
        timerFill.style.width = "0%";
        spawnInterval = SPAWN_INTERVAL_INIT;
        baseSpeed = BASE_SPEED_INIT;
        spawnTimer = 0;
        lastTime = null;
        gameRunning = true;

        falling.forEach((f) => f.el.remove());
        falling = [];
        queue = buildRoundQueue();

        updateScore();
        updateLives();
        updateRoundDisplay();
        clearChoices();
        overlayStart.style.display = "none";
        overlayGameover.style.display = "none";

        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(gameLoop);
      }

      function gameOver() {
        gameRunning = false;
        if (rafId) cancelAnimationFrame(rafId);
        clearChoices();
        finalScoreEl.textContent = score;

        const reviewEl = document.getElementById("wrong-review");
        const listEl = document.getElementById("wrong-review-list");
        if (wrongWords.length > 0) {
          listEl.innerHTML = wrongWords
            .map(
              (w) => `
            <div class="wrong-item">
              <div class="wrong-item-word">${w.word}</div>
              <div class="wrong-item-info">
                <div class="wrong-item-reading">${w.reading || ""}${
                w.romaji ? " · " + w.romaji : ""
              }</div>
                <div class="wrong-item-meaning">${w.vi}</div>
              </div>
            </div>`
            )
            .join("");
          reviewEl.style.display = "";
        } else {
          reviewEl.style.display = "none";
        }

        overlayGameover.style.display = "flex";
        bgStop();
      }

      function gameLoop(ts) {
        if (!gameRunning) return;
        if (lastTime === null) lastTime = ts;
        const dt = Math.min((ts - lastTime) / 1000, 0.1);
        lastTime = ts;

        if (!missPopupOpen) {
          spawnTimer += dt * 1000;
          if (
            spawnTimer >= spawnInterval &&
            falling.length < 1 &&
            wordsSpawnedThisRound < ROUND_SIZE &&
            queue.length > 0
          ) {
            spawnTimer = 0;
            spawnWord();
          }
        }

        const areaH = gameArea.clientHeight;
        const active = falling.find((f) => !f.removing);
        if (active) {
          const total = areaH + 100;
          const pct = Math.max(
            0,
            Math.min(100, ((areaH - active.y) / total) * 100)
          );
          timerFill.style.width = pct + "%";
          if (pct > 55) timerFill.style.background = "#4caf50";
          else if (pct > 25) timerFill.style.background = "#ff9800";
          else timerFill.style.background = "#ef5350";
        }
        for (let i = falling.length - 1; i >= 0; i--) {
          const item = falling[i];
          if (item.removing) continue;
          item.y += item.speed * dt;
          item.el.style.top = item.y + "px";
          if (item.y > areaH) removeFalling(i, "miss");
        }

        if (wordsSpawnedThisRound >= ROUND_SIZE && falling.length === 0) {
          endRound();
          return;
        }

        rafId = requestAnimationFrame(gameLoop);
      }

      function spawnWord() {
        if (!queue.length) return;
        wordsSpawnedThisRound++;
        timerFill.style.width = "100%";
        timerFill.style.background = "#4caf50";
        updateRoundDisplay();
        const wordData = queue.shift();
        const el = document.createElement("div");
        el.className = "fw";

        const areaW = gameArea.clientWidth;
        const mode = pickMode();
        const displayText = mode.reverse
          ? getShortMeaning(wordData.vi)
          : wordData.word;
        el.innerHTML = `<span class="fw-word${mode.reverse ? " fw-vi" : ""}">${displayText}</span>`;

        const speedMult = mode.type === "build" ? 0.85 : 1;
        const speed = (baseSpeed + Math.random() * 10) * speedMult;

        el.style.left = "0px";
        el.style.top = "-100px";
        gameArea.appendChild(el);
        const elW = el.offsetWidth;
        const x = Math.max(
          8,
          Math.min(
            areaW - elW - 8,
            20 + Math.random() * Math.max(20, areaW - elW - 20)
          )
        );
        el.style.left = x + "px";

        falling.push({ el, wordData, x, y: -100, speed, removing: false });
        generateChoices(wordData, mode);
      }

      function onChoice(idx) {
        if (!gameRunning) return;
        const btn = choiceBtns[idx];
        const isCorrect = btn.dataset.correct === "1";

        const fallingIdx = falling.findIndex((f) => !f.removing);
        if (fallingIdx === -1) return;

        if (isCorrect) {
          btn.classList.add("correct-flash");
          correctHit(fallingIdx);
          setTimeout(clearChoices, 200);
        } else {
          btn.classList.add("wrong-flash");
          addToWrongWords(falling[fallingIdx].wordData);
          recordHistory(falling[fallingIdx].wordData, "wrong");
          setTimeout(() => btn.classList.remove("wrong-flash"), 450);
        }
      }

      function correctHit(idx) {
        timerFill.style.width = "0%";
        wordsCaughtThisRound++;
        updateRoundDisplay();
        const item = falling[idx];
        item.removing = true;
        item.el.classList.add("correct");
        spawnParticles(item.el);
        recordHistory(item.wordData, "correct");

        setTimeout(() => {
          item.el.remove();
          falling.splice(falling.indexOf(item), 1);
        }, 500);

        score++;
        updateScore();
        scoreEl.classList.remove("pop");
        void scoreEl.offsetWidth;
        scoreEl.classList.add("pop");
      }

      function removeFalling(idx, type) {
        const item = falling[idx];
        item.removing = true;
        if (type === "miss") {
          item.el.style.opacity = "0";
          item.el.style.transition = "opacity 0.3s";
          lives--;
          updateLives();
          shakeGame();
          clearChoices();
          addToWrongWords(item.wordData);
          recordHistory(item.wordData, "wrong");
          const isGameOver = lives <= 0;
          setTimeout(() => {
            item.el.remove();
            falling.splice(falling.indexOf(item), 1);
            if (isGameOver) {
              gameOver();
            } else {
              showMissPopup(item.wordData);
            }
          }, 350);
        }
      }

      function showMissPopup(wordData) {
        missPopupOpen = true;
        spawnTimer = 0;
        missKanjiEl.textContent = wordData.word;
        missReadingEl.textContent = wordData.reading;
        missRomajiEl.textContent = wordData.romaji;
        missMeaningEl.textContent = wordData.vi;
        missPopupEl.classList.add("visible");
      }

      function closeMissPopup() {
        missPopupOpen = false;
        missPopupEl.classList.remove("visible");
        spawnTimer = -600;
      }

      /* ════════════════════════════════
   ROUND SYSTEM
   ════════════════════════════════ */
      function buildRoundQueue() {
        const seen = new Set();
        const prioritized = wrongWords.filter((w) => {
          if (seen.has(w.word)) return false;
          seen.add(w.word);
          return true;
        });
        const prioritizedSet = new Set(prioritized.map((w) => w.word));
        const others = allWords
          .filter((w) => !prioritizedSet.has(w.word))
          .sort(() => Math.random() - 0.5);
        return [...prioritized, ...others].slice(0, ROUND_SIZE);
      }

      function addToWrongWords(wordData) {
        if (!wrongWords.find((w) => w.word === wordData.word)) {
          wrongWords.push(wordData);
        }
      }

      function endRound() {
        gameRunning = false;
        if (rafId) cancelAnimationFrame(rafId);
        clearChoices();
        roundDoneNumEl.textContent = round;
        roundNextNumEl.textContent = round + 1;
        roundScoreEl.textContent = score;
        const wc = wrongWords.length;
        roundWrongHintEl.textContent =
          wc > 0
            ? `${wc} từ sẽ xuất hiện đầu vòng tiếp`
            : "Hoàn hảo! Không sai từ nào";
        overlayRound.style.display = "flex";
        setTimeout(startNextRound, 2500);
      }

      function startNextRound() {
        overlayRound.style.display = "none";
        overlayStart.style.display = "none";
        overlayGameover.style.display = "none";
        missPopupOpen = false;
        missPopupEl.classList.remove("visible");
        round++;
        wordsSpawnedThisRound = 0;
        wordsCaughtThisRound = 0;
        timerFill.style.width = "0%";
        baseSpeed = Math.min(
          BASE_SPEED_MAX,
          BASE_SPEED_INIT * Math.pow(1.1, round - 1)
        );
        spawnInterval = SPAWN_INTERVAL_INIT;
        spawnTimer = 0;
        lastTime = null;
        queue = buildRoundQueue();
        wrongWords = [];
        applyTheme(randomTheme());
        updateRoundDisplay();
        gameRunning = true;
        rafId = requestAnimationFrame(gameLoop);
      }

      function updateRoundDisplay() {
        roundLabelEl.textContent = `${wordsCaughtThisRound} / ${ROUND_SIZE}`;
      }

      /* ════════════════════════════════
   CHOICES
   ════════════════════════════════ */
      function getShortMeaning(vi) {
        return vi.split(/[,;\/，；]/)[0].trim();
      }

      const CHOICE_MODES = [
        { type: "choice", getText: (w) => getShortMeaning(w.vi), weight: 2 },
        { type: "choice", getText: (w) => w.reading, weight: 2 },
        { type: "choice", getText: (w) => w.romaji, weight: 2 },
        { type: "build", weight: 2 },
        { type: "choice", getText: (w) => w.word, reverse: true, weight: 1 },
      ];

      function pickMode() {
        const total = CHOICE_MODES.reduce((s, m) => s + (m.weight || 1), 0);
        let r = Math.random() * total;
        for (const m of CHOICE_MODES) {
          r -= m.weight || 1;
          if (r <= 0) return m;
        }
        return CHOICE_MODES[CHOICE_MODES.length - 1];
      }

      const HIRAGANA_POOL = [
        ..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ",
      ];

      function isHiraganaOnly(word) {
        return /^[\u3041-\u309f]+$/.test(word);
      }

      function generateChoices(wordData, mode) {
        if (!mode) {
          if (isHiraganaOnly(wordData.word)) {
            mode = CHOICE_MODES[0];
          } else {
            mode = pickMode();
          }
        }

        if (mode.type === "build") {
          showBuildMode(wordData);
          return;
        }

        hideBuildMode();
        const wrongPool = allWords.filter((w) => w.word !== wordData.word);
        const shuffled = wrongPool.sort(() => Math.random() - 0.5).slice(0, 2);

        const choices = [
          { text: mode.getText(wordData), correct: true },
          { text: mode.getText(shuffled[0]), correct: false },
          { text: mode.getText(shuffled[1]), correct: false },
        ].sort(() => Math.random() - 0.5);

        for (let i = 0; i < 3; i++) {
          const btn = choiceBtns[i];
          btn.textContent = choices[i].text;
          btn.dataset.correct = choices[i].correct ? "1" : "0";
          btn.disabled = false;
          btn.classList.remove("correct-flash", "wrong-flash");
        }
      }

      function showBuildMode(wordData) {
        choiceBarEl.style.display = "none";
        buildBarEl.style.display = "flex";
        buildSelected = [];
        buildTarget = wordData.reading;

        const readingChars = [...wordData.reading];
        const distCount = Math.max(3, 6 - readingChars.length);
        const distractors = HIRAGANA_POOL.filter(
          (c) => !readingChars.includes(c)
        )
          .sort(() => Math.random() - 0.5)
          .slice(0, distCount);

        buildTilesEl.innerHTML = "";
        [...readingChars, ...distractors]
          .sort(() => Math.random() - 0.5)
          .forEach((char) => {
            const btn = document.createElement("button");
            btn.className = "build-tile";
            btn.textContent = char;
            btn.onclick = () => onBuildTile(char, btn);
            buildTilesEl.appendChild(btn);
          });

        updateBuildDisplay();
      }

      function hideBuildMode() {
        choiceBarEl.style.display = "";
        buildBarEl.style.display = "none";
        buildSelected = [];
        buildTarget = "";
      }

      function onBuildTile(char, tileEl) {
        if (!gameRunning) return;
        tileEl.disabled = true;
        buildSelected.push({ char, tileEl });
        updateBuildDisplay();
        if (buildSelected.length === [...buildTarget].length) checkBuild();
      }

      function onBuildBackspace() {
        if (!buildSelected.length || !gameRunning) return;
        const last = buildSelected.pop();
        last.tileEl.disabled = false;
        updateBuildDisplay();
      }

      function updateBuildDisplay() {
        buildSelectedEl.innerHTML = buildSelected
          .map((s) => `<span class="build-sel-char">${s.char}</span>`)
          .join("");
      }

      function checkBuild() {
        const answer = buildSelected.map((s) => s.char).join("");
        if (answer === buildTarget) {
          const idx = falling.findIndex((f) => !f.removing);
          if (idx !== -1) {
            correctHit(idx);
            setTimeout(clearChoices, 200);
          }
        } else {
          const fallingIdx2 = falling.findIndex((f) => !f.removing);
          if (fallingIdx2 !== -1) {
            addToWrongWords(falling[fallingIdx2].wordData);
            recordHistory(falling[fallingIdx2].wordData, "wrong");
          }
          buildDisplayEl.classList.remove("build-shake");
          void buildDisplayEl.offsetWidth;
          buildDisplayEl.classList.add("build-shake");
          setTimeout(() => buildDisplayEl.classList.remove("build-shake"), 400);
          buildSelected.forEach((s) => {
            s.tileEl.disabled = false;
          });
          buildSelected = [];
          updateBuildDisplay();
        }
      }

      function clearChoices() {
        hideBuildMode();
        choiceBtns.forEach((btn) => {
          btn.textContent = "—";
          btn.dataset.correct = "0";
          btn.disabled = true;
          btn.classList.remove("correct-flash", "wrong-flash");
        });
      }

      /* ════════════════════════════════
   HELPERS
   ════════════════════════════════ */
      function updateScore() {
        scoreEl.textContent = score;
      }

      function updateLives() {
        livesEl.innerHTML = "";
        for (let i = 0; i < MAX_LIVES; i++) {
          const d = document.createElement("div");
          d.className = "life-heart" + (i >= lives ? " lost" : "");
          d.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 15.5S2 11 2 6a4 4 0 0 1 7-2.65A4 4 0 0 1 16 6c0 5-7 9.5-7 9.5z"
              fill="${i < lives ? "#ef5350" : "none"}"
              stroke="${i < lives ? "#ef5350" : "#6b3535"}"
              stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>`;
          livesEl.appendChild(d);
        }
      }

      function shakeGame() {
        gameArea.style.animation = "none";
        void gameArea.offsetWidth;
        gameArea.style.animation = "shake-area 0.3s ease-out";
      }

      function spawnParticles(el) {
        const rect = el.getBoundingClientRect();
        const areaRect = gameArea.getBoundingClientRect();
        const cx = rect.left + rect.width / 2 - areaRect.left;
        const cy = rect.top + rect.height / 2 - areaRect.top;
        const colors = THEMES[currentTheme].particle;

        for (let i = 0; i < 10; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          const angle = (i / 10) * Math.PI * 2;
          const dist = 40 + Math.random() * 35;
          p.style.cssText = `left:${cx}px;top:${cy}px;
      --dx:${Math.cos(angle) * dist}px;--dy:${Math.sin(angle) * dist}px;
      background:${colors[Math.floor(Math.random() * colors.length)]};`;
          gameArea.appendChild(p);
          setTimeout(() => p.remove(), 750);
        }
      }

      /* ════════════════════════════════
   HISTORY
   ════════════════════════════════ */
      const HISTORY_KEY = "falling-vocab-history";
      let currentSort = "wrong";

      function loadHistory() {
        try {
          return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {};
        } catch {
          return {};
        }
      }

      function recordHistory(wordData, result) {
        const h = loadHistory();
        const key = wordData.word;
        if (!h[key]) {
          h[key] = {
            word: wordData.word,
            reading: wordData.reading || "",
            romaji: wordData.romaji || "",
            vi: wordData.vi,
            correct: 0,
            wrong: 0,
            lastSeen: 0,
          };
        }
        h[key][result]++;
        h[key].lastSeen = Date.now();
        localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
      }

      function setSortMode(mode) {
        currentSort = mode;
        document
          .querySelectorAll(".h-sort-btn")
          .forEach((b) => b.classList.remove("active"));
        document.getElementById("sort-" + mode).classList.add("active");
        renderHistoryList();
      }

      function openHistory() {
        const panel = document.getElementById("history-panel");
        panel.classList.add("open");
        renderHistoryList();
      }

      function closeHistory() {
        document.getElementById("history-panel").classList.remove("open");
      }

      function renderHistoryList() {
        const h = loadHistory();
        const items = Object.values(h);

        // stats
        const totalCorrect = items.reduce((s, i) => s + i.correct, 0);
        const totalWrong = items.reduce((s, i) => s + i.wrong, 0);
        document.getElementById("hs-total").textContent = items.length;
        document.getElementById("hs-correct").textContent = totalCorrect;
        document.getElementById("hs-wrong").textContent = totalWrong;

        if (items.length === 0) {
          document.getElementById("history-list").innerHTML =
            '<div class="h-empty">Chưa có dữ liệu.<br>Hãy chơi game để ghi lịch sử.</div>';
          return;
        }

        const sorted = [...items].sort((a, b) => {
          if (currentSort === "wrong")
            return (
              b.wrong - b.correct - (a.wrong - a.correct) || b.wrong - a.wrong
            );
          if (currentSort === "recent") return b.lastSeen - a.lastSeen;
          return a.word.localeCompare(b.word);
        });

        document.getElementById("history-list").innerHTML = sorted
          .map(
            (item) => `
          <div class="h-item">
            <div class="h-item-word">${item.word}</div>
            <div class="h-item-info">
              <div class="h-item-reading">${item.reading}${
              item.romaji ? " · " + item.romaji : ""
            }</div>
              <div class="h-item-meaning">${item.vi
                .split(/[\/,;]/)[0]
                .trim()}</div>
            </div>
            <div class="h-item-counts">
              <span class="h-count c">✓ ${item.correct}</span>
              <span class="h-count w">✗ ${item.wrong}</span>
            </div>
          </div>`
          )
          .join("");
      }

      /* ════════════════════════════════
   INIT
   ════════════════════════════════ */
      loadWords();
      updateLives();
      applyTheme(randomTheme());
    </script>
  </body>
</html>
