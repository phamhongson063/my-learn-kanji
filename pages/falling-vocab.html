<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Từ Vựng Rơi</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Inter", sans-serif;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        display: flex;
        flex-direction: column;
      }

      /* ════════════════════════════════════════
   THEMES — applied on #game-area
   ════════════════════════════════════════ */

      /* ══════════════════════════════════════════════
         SPACE
      ══════════════════════════════════════════════ */
      #game-area.theme-space {
        background: radial-gradient(
            ellipse 80% 60% at 20% 40%,
            #1a0050 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 70% 50% at 80% 20%,
            #000d3a 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 60% 40% at 55% 85%,
            #1a0035 0%,
            transparent 50%
          ),
          linear-gradient(
            to bottom,
            #02000f 0%,
            #06001f 35%,
            #0c0030 65%,
            #110038 100%
          );
      }
      #game-area.theme-space .bg-nebula {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
            ellipse 75% 55% at 15% 22%,
            rgba(140, 0, 255, 0.22) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 60% 45% at 85% 55%,
            rgba(0, 80, 220, 0.2) 0%,
            transparent 58%
          ),
          radial-gradient(
            ellipse 50% 35% at 50% 78%,
            rgba(220, 0, 100, 0.16) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 35% 28% at 72% 12%,
            rgba(0, 200, 255, 0.12) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 40% 30% at 30% 65%,
            rgba(180, 0, 180, 0.1) 0%,
            transparent 48%
          );
      }
      .space-aurora {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 40%;
        pointer-events: none;
        background: linear-gradient(
          to top,
          rgba(0, 255, 160, 0.14) 0%,
          rgba(0, 180, 255, 0.08) 35%,
          rgba(120, 0, 255, 0.05) 60%,
          transparent 85%
        );
        filter: blur(22px);
        animation: aurora-shift 9s ease-in-out infinite alternate;
      }
      @keyframes aurora-shift {
        0% {
          opacity: 0.7;
          transform: scaleX(1) skewX(0deg);
        }
        33% {
          opacity: 1;
          transform: scaleX(1.04) skewX(2deg);
        }
        66% {
          opacity: 0.8;
          transform: scaleX(0.97) skewX(-2deg);
        }
        100% {
          opacity: 1;
          transform: scaleX(1.06) skewX(1deg);
        }
      }
      .space-planet {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: var(--max-op, 0.85);
          transform: scale(1);
        }
        50% {
          opacity: 0.05;
          transform: scale(0.5);
        }
      }
      .shooting-star {
        position: absolute;
        height: 1.5px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.9),
          transparent
        );
        border-radius: 2px;
        animation: shoot var(--dur, 6s) linear infinite var(--delay, 0s);
        opacity: 0;
      }
      @keyframes shoot {
        0% {
          transform: translateX(0) translateY(0) rotate(-35deg);
          opacity: 0;
        }
        4% {
          opacity: 1;
        }
        22% {
          transform: translateX(500px) translateY(250px) rotate(-35deg);
          opacity: 0;
        }
        100% {
          transform: translateX(500px) translateY(250px) rotate(-35deg);
          opacity: 0;
        }
      }

      /* ══════════════════════════════════════════════
         SKY
      ══════════════════════════════════════════════ */
      #game-area.theme-sky {
        background: linear-gradient(
          to bottom,
          #0a2a6e 0%,
          #1a4fa8 12%,
          #2979c8 28%,
          #4fa8e8 48%,
          #80c8f0 66%,
          #b8e0f8 82%,
          #fde8c8 94%,
          #fdd8a0 100%
        );
      }
      .sky-sun-wrap {
        position: absolute;
        top: 22px;
        right: 55px;
        width: 80px;
        height: 80px;
      }
      .sky-sun-core {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fffde7 20%,
          #fff176 55%,
          rgba(255, 235, 59, 0) 100%
        );
        box-shadow: 0 0 30px 12px rgba(255, 236, 64, 0.6),
          0 0 70px 35px rgba(255, 180, 0, 0.3);
        animation: sun-pulse 5s ease-in-out infinite;
      }
      .sky-sun-ray {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(255, 230, 0, 0.18) 4deg,
          transparent 8deg,
          transparent 14deg,
          rgba(255, 220, 0, 0.14) 18deg,
          transparent 22deg,
          transparent 28deg,
          rgba(255, 230, 0, 0.18) 32deg,
          transparent 36deg,
          transparent 42deg,
          rgba(255, 220, 0, 0.12) 46deg,
          transparent 50deg,
          transparent 56deg,
          rgba(255, 230, 0, 0.18) 60deg,
          transparent 64deg,
          transparent 70deg,
          rgba(255, 220, 0, 0.14) 74deg,
          transparent 78deg,
          transparent 84deg,
          rgba(255, 230, 0, 0.16) 88deg,
          transparent 92deg,
          transparent 98deg,
          rgba(255, 220, 0, 0.12) 102deg,
          transparent 106deg,
          transparent 112deg,
          rgba(255, 230, 0, 0.18) 116deg,
          transparent 120deg,
          transparent 126deg,
          rgba(255, 220, 0, 0.14) 130deg,
          transparent 134deg,
          transparent 140deg,
          rgba(255, 230, 0, 0.16) 144deg,
          transparent 148deg,
          transparent 154deg,
          rgba(255, 220, 0, 0.12) 158deg,
          transparent 162deg,
          transparent 168deg,
          rgba(255, 230, 0, 0.18) 172deg,
          transparent 176deg,
          transparent 182deg,
          rgba(255, 220, 0, 0.14) 186deg,
          transparent 190deg,
          transparent 196deg,
          rgba(255, 230, 0, 0.18) 200deg,
          transparent 204deg,
          transparent 210deg,
          rgba(255, 220, 0, 0.12) 214deg,
          transparent 218deg,
          transparent 224deg,
          rgba(255, 230, 0, 0.18) 228deg,
          transparent 232deg,
          transparent 238deg,
          rgba(255, 220, 0, 0.14) 242deg,
          transparent 246deg,
          transparent 252deg,
          rgba(255, 230, 0, 0.16) 256deg,
          transparent 260deg,
          transparent 266deg,
          rgba(255, 220, 0, 0.12) 270deg,
          transparent 274deg,
          transparent 280deg,
          rgba(255, 230, 0, 0.18) 284deg,
          transparent 288deg,
          transparent 294deg,
          rgba(255, 220, 0, 0.14) 298deg,
          transparent 302deg,
          transparent 308deg,
          rgba(255, 230, 0, 0.18) 312deg,
          transparent 316deg,
          transparent 322deg,
          rgba(255, 220, 0, 0.14) 326deg,
          transparent 330deg,
          transparent 336deg,
          rgba(255, 230, 0, 0.16) 340deg,
          transparent 344deg,
          transparent 350deg,
          rgba(255, 220, 0, 0.12) 354deg,
          transparent 360deg
        );
        animation: ray-spin 30s linear infinite;
        filter: blur(1px);
      }
      @keyframes ray-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes sun-pulse {
        0%,
        100% {
          box-shadow: 0 0 30px 12px rgba(255, 236, 64, 0.6),
            0 0 70px 35px rgba(255, 180, 0, 0.3);
        }
        50% {
          box-shadow: 0 0 45px 18px rgba(255, 240, 80, 0.75),
            0 0 100px 50px rgba(255, 190, 0, 0.4);
        }
      }
      .sky-cloud {
        position: absolute;
        border-radius: 50px;
        animation: cloud-drift linear infinite;
      }
      @keyframes cloud-drift {
        from {
          transform: translateX(-320px);
        }
        to {
          transform: translateX(calc(100vw + 320px));
        }
      }
      .sky-mountain {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        pointer-events: none;
      }
      .sky-bird {
        position: absolute;
        animation: bird-fly linear infinite;
        opacity: 0.7;
      }
      @keyframes bird-fly {
        from {
          transform: translateX(-80px) translateY(0);
        }
        50% {
          transform: translateX(50vw) translateY(-20px);
        }
        to {
          transform: translateX(calc(100vw + 80px)) translateY(5px);
        }
      }

      /* ══════════════════════════════════════════════
         OCEAN
      ══════════════════════════════════════════════ */
      #game-area.theme-ocean {
        background: linear-gradient(
          to bottom,
          #003d5c 0%,
          #002a4a 18%,
          #001835 38%,
          #000e28 60%,
          #00071a 80%,
          #00040f 100%
        );
      }
      .ocean-surface {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(
          to right,
          rgba(100, 220, 255, 0),
          rgba(120, 230, 255, 0.45),
          rgba(80, 210, 255, 0.25),
          rgba(140, 240, 255, 0.5),
          rgba(100, 220, 255, 0)
        );
        animation: surface-shimmer 4s ease-in-out infinite alternate;
        filter: blur(1px);
      }
      @keyframes surface-shimmer {
        from {
          opacity: 0.5;
          transform: scaleX(1);
        }
        to {
          opacity: 1;
          transform: scaleX(1.02);
        }
      }
      .caustic-ray {
        position: absolute;
        top: 0;
        width: 3px;
        border-radius: 0 0 3px 3px;
        background: linear-gradient(
          to bottom,
          rgba(80, 210, 255, 0.35),
          transparent
        );
        animation: caustic-sway var(--dur, 5s) ease-in-out infinite alternate
          var(--delay, 0s);
        transform-origin: top center;
      }
      @keyframes caustic-sway {
        from {
          transform: skewX(var(--sk-from, -6deg)) scaleY(0.75);
          opacity: 0.4;
        }
        to {
          transform: skewX(var(--sk-to, 6deg)) scaleY(1.3);
          opacity: 0.7;
        }
      }
      .bio-particle {
        position: absolute;
        border-radius: 50%;
        animation: bio-float var(--dur, 8s) ease-in-out infinite
          var(--delay, 0s);
        opacity: 0;
      }
      @keyframes bio-float {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.85;
        }
        85% {
          opacity: 0.5;
        }
        100% {
          transform: translateY(-100vh) translateX(var(--dx, 15px));
          opacity: 0;
        }
      }
      .ocean-wave {
        position: absolute;
        bottom: 0;
        left: -100%;
        width: 300%;
        pointer-events: none;
      }
      .ocean-wave svg {
        display: block;
      }
      .wave1 {
        animation: wave-move 6s linear infinite;
        opacity: 0.55;
      }
      .wave2 {
        animation: wave-move 9s linear infinite reverse;
        opacity: 0.35;
        bottom: -5px;
      }
      .wave3 {
        animation: wave-move 13s linear infinite;
        opacity: 0.2;
        bottom: -10px;
      }
      @keyframes wave-move {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(33.33%);
        }
      }
      .bubble {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(100, 220, 255, 0.5);
        background: rgba(100, 220, 255, 0.06);
        animation: bubble-rise linear infinite;
      }
      @keyframes bubble-rise {
        from {
          transform: translateY(0) translateX(0);
          opacity: 0.7;
        }
        50% {
          transform: translateY(-40%) translateX(8px);
          opacity: 0.5;
        }
        to {
          transform: translateY(-100%) translateX(-6px);
          opacity: 0;
        }
      }
      .ocean-fish {
        position: absolute;
        font-size: 20px;
        animation: fish-swim linear infinite;
      }
      @keyframes fish-swim {
        from {
          transform: translateX(-70px);
        }
        to {
          transform: translateX(calc(100vw + 70px));
        }
      }
      .ocean-jellyfish {
        position: absolute;
        animation: jelly-drift ease-in-out infinite alternate;
        filter: blur(0.5px);
      }
      @keyframes jelly-drift {
        from {
          transform: translateY(0) scale(1);
          opacity: 0.55;
        }
        to {
          transform: translateY(-18px) scale(1.05);
          opacity: 0.8;
        }
      }

      /* ══════════════════════════════════════════════
         DESERT
      ══════════════════════════════════════════════ */
      #game-area.theme-desert {
        background: linear-gradient(
          to bottom,
          #12002e 0%,
          #380060 8%,
          #7a0a5a 18%,
          #b52040 30%,
          #e04828 42%,
          #f07028 54%,
          #f09830 66%,
          #f0c050 78%,
          #f0d880 90%,
          #e8cc78 100%
        );
      }
      .desert-glow {
        position: absolute;
        bottom: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 200%;
        height: 35%;
        background: radial-gradient(
          ellipse at 50% 80%,
          rgba(240, 100, 20, 0.45) 0%,
          rgba(240, 150, 30, 0.2) 35%,
          transparent 70%
        );
        pointer-events: none;
        animation: glow-pulse 4s ease-in-out infinite alternate;
        filter: blur(20px);
      }
      @keyframes glow-pulse {
        from {
          opacity: 0.7;
          transform: translateX(-50%) scaleY(1);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) scaleY(1.12);
        }
      }
      .desert-sun {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fff4c2 15%,
          #ffe066 50%,
          rgba(255, 180, 0, 0) 80%
        );
        box-shadow: 0 0 55px 25px rgba(255, 210, 80, 0.65),
          0 0 120px 70px rgba(255, 140, 0, 0.35);
        animation: desert-sun-pulse 5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes desert-sun-pulse {
        0%,
        100% {
          box-shadow: 0 0 55px 25px rgba(255, 210, 80, 0.65),
            0 0 120px 70px rgba(255, 140, 0, 0.35);
        }
        50% {
          box-shadow: 0 0 75px 35px rgba(255, 220, 90, 0.8),
            0 0 160px 90px rgba(255, 160, 0, 0.45);
        }
      }
      .desert-dune {
        position: absolute;
        bottom: 0;
        pointer-events: none;
      }
      .desert-haze {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 120px;
        background: linear-gradient(
          to top,
          rgba(240, 180, 80, 0.35),
          transparent
        );
        animation: haze 4s ease-in-out infinite alternate;
        pointer-events: none;
        filter: blur(4px);
      }
      @keyframes haze {
        from {
          opacity: 0.5;
          transform: scaleX(1);
        }
        to {
          opacity: 0.9;
          transform: scaleX(1.03);
        }
      }
      .sand-particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(240, 200, 100, 0.6);
        animation: sand-drift linear infinite;
      }
      @keyframes sand-drift {
        from {
          transform: translateX(0) translateY(0);
          opacity: 0;
        }
        10% {
          opacity: 0.7;
        }
        90% {
          opacity: 0.4;
        }
        to {
          transform: translateX(var(--dx, 80px)) translateY(var(--dy, -60px));
          opacity: 0;
        }
      }

      /* ══════════════════════════════════════════════
         MEADOW
      ══════════════════════════════════════════════ */
      #game-area.theme-meadow {
        background: linear-gradient(
          to bottom,
          #0e3a8a 0%,
          #1d6cc8 15%,
          #3a9ae8 32%,
          #70c4f0 50%,
          #a8ddf8 65%,
          #c8eecc 78%,
          #7ac870 90%,
          #4aaa3c 100%
        );
      }
      .meadow-sun {
        position: absolute;
        top: 18px;
        left: 36px;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #fffde7 25%,
          #fff176 60%,
          rgba(255, 235, 59, 0) 100%
        );
        box-shadow: 0 0 28px 12px rgba(255, 238, 88, 0.6),
          0 0 65px 32px rgba(255, 200, 0, 0.28);
        animation: sun-pulse 5s ease-in-out infinite;
      }
      .meadow-cloud {
        position: absolute;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 4px 18px rgba(100, 160, 255, 0.15);
        animation: cloud-drift linear infinite;
      }
      .meadow-hill {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        pointer-events: none;
      }
      .grass-strip {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 80px;
        background: linear-gradient(to bottom, #3cb83c, #2a8c2a);
        border-radius: 45% 55% 0 0 / 18px 18px 0 0;
        pointer-events: none;
      }
      .grass-blade {
        position: absolute;
        bottom: 100%;
        width: 3px;
        background: linear-gradient(to top, #2a8c2a, #6ed46e);
        border-radius: 3px 3px 0 0;
        transform-origin: bottom center;
        animation: sway var(--dur, 2s) ease-in-out infinite alternate
          var(--delay, 0s);
      }
      @keyframes sway {
        from {
          transform: rotate(var(--from, -8deg));
        }
        to {
          transform: rotate(var(--to, 8deg));
        }
      }
      .flower {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: flower-bob 3s ease-in-out infinite alternate var(--delay, 0s);
      }
      @keyframes flower-bob {
        from {
          transform: translateY(0) scale(1);
        }
        to {
          transform: translateY(-5px) scale(1.08);
        }
      }
      .petal {
        position: absolute;
        border-radius: 50% 0;
        pointer-events: none;
        animation: petal-fall var(--dur, 8s) ease-in var(--delay, 0s) infinite;
        opacity: 0;
      }
      @keyframes petal-fall {
        0% {
          transform: translateX(0) translateY(-20px) rotate(0deg) scale(1);
          opacity: 0;
        }
        5% {
          opacity: 0.85;
        }
        85% {
          opacity: 0.7;
        }
        100% {
          transform: translateX(var(--dx, 40px)) translateY(100vh)
            rotate(var(--rot, 480deg)) scale(0.8);
          opacity: 0;
        }
      }
      .butterfly {
        position: absolute;
        font-size: 16px;
        animation: butterfly-fly linear infinite;
      }
      @keyframes butterfly-fly {
        0% {
          transform: translateX(-50px) translateY(0);
          opacity: 0;
        }
        8% {
          opacity: 0.85;
        }
        90% {
          opacity: 0.85;
        }
        100% {
          transform: translateX(calc(100vw+50px)) translateY(-25px);
          opacity: 0;
        }
      }

      /* ════════════════════════════════════════
   NAVBAR
   ════════════════════════════════════════ */
      .g-nav {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 16px;
        height: 52px;
        gap: 0;
        z-index: 50;
        transition: background 0.6s, border-color 0.6s;
      }
      .g-nav.dark-nav {
        background: rgba(5, 2, 21, 0.9);
        border-bottom: 1px solid rgba(150, 120, 255, 0.12);
        backdrop-filter: blur(16px);
      }
      .g-nav.light-nav {
        background: rgba(255, 255, 255, 0.22);
        border-bottom: 1px solid rgba(255, 255, 255, 0.28);
        backdrop-filter: blur(16px);
      }

      /* Back icon button */
      .g-nav-back {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: background 0.2s, border-color 0.2s, opacity 0.2s, color 0.4s;
        opacity: 0.6;
      }
      .dark-nav .g-nav-back {
        color: #b39ddb;
        border-color: rgba(150, 120, 255, 0.2);
      }
      .light-nav .g-nav-back {
        color: #1a237e;
        border-color: rgba(21, 101, 192, 0.22);
      }
      .dark-nav .g-nav-back:hover {
        opacity: 1;
        background: rgba(150, 120, 255, 0.1);
        border-color: rgba(150, 120, 255, 0.4);
      }
      .light-nav .g-nav-back:hover {
        opacity: 1;
        background: rgba(21, 101, 192, 0.08);
        border-color: rgba(21, 101, 192, 0.35);
      }

      /* Audio toggle button */
      .g-audio-btn {
        flex-shrink: 0;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        cursor: pointer;
        transition: background 0.2s, border-color 0.2s, opacity 0.2s, color 0.4s;
        opacity: 0.6;
      }
      .dark-nav .g-audio-btn {
        color: #b39ddb;
        border-color: rgba(150, 120, 255, 0.2);
      }
      .light-nav .g-audio-btn {
        color: #1a237e;
        border-color: rgba(21, 101, 192, 0.22);
      }
      .dark-nav .g-audio-btn:hover {
        opacity: 1;
        background: rgba(150, 120, 255, 0.1);
        border-color: rgba(150, 120, 255, 0.4);
      }
      .light-nav .g-audio-btn:hover {
        opacity: 1;
        background: rgba(21, 101, 192, 0.08);
        border-color: rgba(21, 101, 192, 0.35);
      }
      .g-audio-btn.muted {
        opacity: 0.3;
      }

      /* Center */
      .g-nav-center {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .g-nav-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        transition: color 0.4s;
        font-variant-numeric: tabular-nums;
      }
      .dark-nav .g-nav-title {
        color: rgba(220, 200, 255, 0.75);
      }
      .light-nav .g-nav-title {
        color: rgba(0, 40, 100, 0.7);
      }

      #round-progress-bar {
        width: 96px;
        height: 4px;
        border-radius: 4px;
        overflow: hidden;
      }
      .dark-nav #round-progress-bar {
        background: rgba(255, 255, 255, 0.08);
      }
      .light-nav #round-progress-bar {
        background: rgba(0, 0, 0, 0.08);
      }
      #round-progress-fill {
        height: 100%;
        border-radius: 4px;
        width: 100%;
        background: #4caf50;
        transition: background 0.4s;
      }

      /* Right: lives + score */
      .g-score {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .g-lives {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .life-heart {
        width: 20px;
        height: 20px;
        transition: opacity 0.3s, transform 0.3s, filter 0.3s;
      }
      .life-heart svg {
        display: block;
      }
      .life-heart.lost {
        opacity: 0.18;
        transform: scale(0.75);
        filter: grayscale(1);
      }

      .g-score-divider {
        width: 1px;
        height: 20px;
        opacity: 0.2;
        flex-shrink: 0;
      }
      .dark-nav .g-score-divider {
        background: #b39ddb;
      }
      .light-nav .g-score-divider {
        background: #1a237e;
      }

      .g-score-num {
        font-size: 22px;
        font-weight: 900;
        line-height: 1;
        min-width: 28px;
        text-align: right;
        transition: color 0.4s;
      }
      .dark-nav .g-score-num {
        color: #d4bbff;
      }
      .light-nav .g-score-num {
        color: #1a237e;
      }

      .g-score-num.pop {
        animation: score-pop 0.35s ease-out;
      }
      @keyframes score-pop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.55);
        }
        100% {
          transform: scale(1);
        }
      }

      /* History panel */
      #history-panel {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        pointer-events: none;
      }

      #history-panel.open {
        pointer-events: all;
      }

      #history-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0);
        transition: background 0.3s;
      }
      #history-panel.open #history-backdrop {
        background: rgba(0, 0, 0, 0.55);
      }

      #history-drawer {
        position: relative;
        z-index: 1;
        width: min(360px, 92vw);
        height: 100%;
        background: #0f0a2a;
        border-left: 1px solid rgba(150, 120, 255, 0.2);
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: -8px 0 40px rgba(0, 0, 0, 0.5);
      }
      #history-panel.open #history-drawer {
        transform: translateX(0);
      }

      #history-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid rgba(150, 120, 255, 0.15);
        flex-shrink: 0;
      }

      #history-title {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        color: rgba(180, 150, 255, 0.8);
      }

      #history-close {
        background: none;
        border: none;
        color: rgba(180, 150, 255, 0.5);
        font-size: 20px;
        cursor: pointer;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
        transition: color 0.2s, background 0.2s;
      }
      #history-close:hover {
        color: #b39ddb;
        background: rgba(150, 120, 255, 0.12);
      }

      #history-stats {
        padding: 10px 20px;
        border-bottom: 1px solid rgba(150, 120, 255, 0.1);
        display: flex;
        gap: 20px;
        flex-shrink: 0;
      }

      .h-stat {
        font-size: 11px;
        letter-spacing: 1px;
        color: rgba(180, 150, 255, 0.45);
      }
      .h-stat span {
        font-size: 16px;
        font-weight: 700;
        display: block;
        margin-bottom: 1px;
      }
      .h-stat.correct span {
        color: #81c784;
      }
      .h-stat.wrong span {
        color: #ef5350;
      }
      .h-stat.total span {
        color: #b39ddb;
      }

      #history-list {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px 24px;
        scrollbar-width: thin;
        scrollbar-color: rgba(150, 120, 255, 0.2) transparent;
      }

      .h-empty {
        text-align: center;
        padding: 60px 20px;
        color: rgba(180, 150, 255, 0.3);
        font-size: 13px;
        letter-spacing: 1px;
      }

      .h-sort-bar {
        display: flex;
        gap: 8px;
        padding: 8px 16px 4px;
        flex-shrink: 0;
      }

      .h-sort-btn {
        font-size: 10px;
        letter-spacing: 1.5px;
        padding: 4px 10px;
        border-radius: 20px;
        border: 1px solid rgba(150, 120, 255, 0.2);
        background: none;
        color: rgba(180, 150, 255, 0.45);
        cursor: pointer;
        transition: all 0.18s;
        font-family: "Inter", sans-serif;
      }
      .h-sort-btn.active {
        background: rgba(126, 87, 194, 0.3);
        border-color: rgba(150, 120, 255, 0.5);
        color: #b39ddb;
      }

      .h-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 6px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(150, 120, 255, 0.08);
      }

      .h-item-word {
        font-size: 22px;
        color: #b39ddb;
        min-width: 48px;
        text-align: center;
        flex-shrink: 0;
        line-height: 1;
      }

      .h-item-info {
        flex: 1;
        min-width: 0;
      }

      .h-item-reading {
        font-size: 10px;
        color: rgba(180, 150, 255, 0.45);
        letter-spacing: 1px;
        margin-bottom: 2px;
      }

      .h-item-meaning {
        font-size: 12px;
        color: rgba(237, 231, 246, 0.7);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .h-item-counts {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        flex-shrink: 0;
      }

      .h-count {
        font-size: 11px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 10px;
        letter-spacing: 0.5px;
        min-width: 36px;
        text-align: center;
      }
      .h-count.c {
        background: rgba(76, 175, 80, 0.18);
        color: #81c784;
      }
      .h-count.w {
        background: rgba(239, 83, 80, 0.18);
        color: #ef5350;
      }

      /* ════════════════════════════════════════
   GAME AREA
   ════════════════════════════════════════ */
      #game-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        transition: background 0.8s;
      }

      #game-area::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 6px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(180, 30, 30, 0.6),
          transparent
        );
        z-index: 5;
      }

      /* ════════════════════════════════════════
   FALLING WORD CARD — Glassmorphism
   ════════════════════════════════════════ */
      .fw {
        position: absolute;
        border-radius: 22px;
        padding: 16px 28px 14px;
        min-width: 110px;
        white-space: nowrap;
        text-align: center;
        cursor: default;
        user-select: none;
        z-index: 10;
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transition: box-shadow 0.25s, transform 0.25s, border-color 0.25s;
      }

      /* Shine overlay */
      .fw::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.18) 0%,
          transparent 55%
        );
        pointer-events: none;
      }

      .fw-word {
        display: block;
        font-size: 38px;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: 2px;
        position: relative;
      }
      .fw-word.fw-vi {
        font-size: 18px;
        letter-spacing: 0.3px;
        font-weight: 700;
      }

      /* ── SPACE ── */
      .theme-space .fw {
        background: linear-gradient(
          135deg,
          rgba(70, 20, 130, 0.55),
          rgba(20, 5, 60, 0.5)
        );
        border: 1px solid rgba(180, 130, 255, 0.3);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset,
          0 0 24px rgba(140, 80, 255, 0.2);
      }
      .theme-space .fw-word {
        color: #e8d5ff;
        text-shadow: 0 0 18px rgba(200, 150, 255, 0.7),
          0 2px 4px rgba(0, 0, 0, 0.4);
      }
      .theme-space .fw.highlight {
        border-color: rgba(200, 160, 255, 0.7);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.06) inset,
          0 0 36px rgba(180, 120, 255, 0.55);
        transform: scale(1.04);
      }

      /* ── SKY ── */
      .theme-sky .fw {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.65),
          rgba(220, 240, 255, 0.5)
        );
        border: 1px solid rgba(100, 180, 255, 0.4);
        box-shadow: 0 8px 28px rgba(30, 80, 160, 0.18),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset,
          0 0 18px rgba(80, 160, 255, 0.15);
      }
      .theme-sky .fw-word {
        color: #0d47a1;
        text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8),
          0 0 12px rgba(30, 100, 220, 0.2);
      }
      .theme-sky .fw.highlight {
        border-color: rgba(30, 120, 255, 0.6);
        box-shadow: 0 8px 28px rgba(30, 80, 160, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.6) inset,
          0 0 28px rgba(50, 150, 255, 0.4);
        transform: scale(1.04);
      }

      /* ── OCEAN ── */
      .theme-ocean .fw {
        background: linear-gradient(
          135deg,
          rgba(0, 60, 110, 0.6),
          rgba(0, 20, 60, 0.55)
        );
        border: 1px solid rgba(80, 200, 255, 0.3);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.05) inset,
          0 0 20px rgba(0, 180, 255, 0.18);
      }
      .theme-ocean .fw-word {
        color: #b3e5fc;
        text-shadow: 0 0 16px rgba(80, 200, 255, 0.65),
          0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .theme-ocean .fw.highlight {
        border-color: rgba(80, 210, 255, 0.65);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.07) inset,
          0 0 32px rgba(40, 200, 255, 0.5);
        transform: scale(1.04);
      }

      /* ── DESERT ── */
      .theme-desert .fw {
        background: linear-gradient(
          135deg,
          rgba(255, 245, 210, 0.7),
          rgba(255, 225, 160, 0.55)
        );
        border: 1px solid rgba(220, 120, 20, 0.35);
        box-shadow: 0 8px 28px rgba(120, 50, 0, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.45) inset,
          0 0 18px rgba(230, 120, 0, 0.15);
      }
      .theme-desert .fw-word {
        color: #b71c1c;
        text-shadow: 0 1px 3px rgba(255, 220, 150, 0.8),
          0 0 12px rgba(220, 80, 0, 0.2);
      }
      .theme-desert .fw.highlight {
        border-color: rgba(230, 100, 0, 0.6);
        box-shadow: 0 8px 28px rgba(120, 50, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset,
          0 0 28px rgba(240, 120, 0, 0.45);
        transform: scale(1.04);
      }

      /* ── MEADOW ── */
      .theme-meadow .fw {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.65),
          rgba(220, 255, 225, 0.55)
        );
        border: 1px solid rgba(60, 160, 80, 0.35);
        box-shadow: 0 8px 28px rgba(20, 80, 30, 0.18),
          0 0 0 1px rgba(255, 255, 255, 0.5) inset,
          0 0 16px rgba(60, 180, 80, 0.15);
      }
      .theme-meadow .fw-word {
        color: #1b5e20;
        text-shadow: 0 1px 3px rgba(220, 255, 225, 0.9),
          0 0 12px rgba(50, 160, 70, 0.2);
      }
      .theme-meadow .fw.highlight {
        border-color: rgba(50, 160, 70, 0.6);
        box-shadow: 0 8px 28px rgba(20, 80, 30, 0.25),
          0 0 0 1px rgba(255, 255, 255, 0.55) inset,
          0 0 26px rgba(60, 200, 80, 0.45);
        transform: scale(1.04);
      }

      /* Correct animation */
      @keyframes fw-correct {
        0% {
          transform: scale(1);
          opacity: 1;
          filter: brightness(1);
        }
        35% {
          transform: scale(1.22);
          opacity: 1;
          filter: brightness(1.6);
        }
        100% {
          transform: scale(0.4) translateY(-50px);
          opacity: 0;
          filter: brightness(2);
        }
      }
      .fw.correct {
        animation: fw-correct 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        pointer-events: none;
      }

      /* ════════════════════════════════════════
   CHOICE BAR
   ════════════════════════════════════════ */
      #choice-bar {
        flex-shrink: 0;
        padding: 10px 14px 14px;
        display: flex;
        gap: 8px;
        align-items: stretch;
        z-index: 50;
        transition: background 0.6s, border-color 0.6s;
      }
      #choice-btns {
        display: contents;
      }
      .input-bar-dark {
        background: rgba(5, 2, 21, 0.96);
        border-top: 1px solid rgba(150, 120, 255, 0.15);
      }
      .input-bar-light {
        background: rgba(255, 255, 255, 0.35);
        border-top: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
      }

      .choice-btn {
        flex: 1;
        padding: 12px 8px;
        border-radius: 14px;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.2px;
        line-height: 1.35;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 56px;
        transition: transform 0.15s, box-shadow 0.18s, background 0.2s,
          border-color 0.2s, opacity 0.2s;
      }
      .choice-btn:active {
        transform: scale(0.95) !important;
      }
      .choice-btn:disabled {
        cursor: default;
        opacity: 0.3;
        pointer-events: none;
      }

      /* dark theme buttons */
      .input-bar-dark .choice-btn {
        background: rgba(70, 40, 140, 0.3);
        border: 1.5px solid rgba(150, 120, 255, 0.25);
        color: #d8c8ff;
      }
      .input-bar-dark .choice-btn:not(:disabled):hover {
        background: rgba(100, 70, 180, 0.42);
        border-color: rgba(180, 150, 255, 0.55);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(120, 80, 255, 0.35);
      }

      /* light theme buttons */
      .input-bar-light .choice-btn {
        background: rgba(255, 255, 255, 0.65);
        border: 1.5px solid rgba(100, 160, 220, 0.3);
        color: #1a237e;
      }
      .input-bar-light .choice-btn:not(:disabled):hover {
        background: rgba(255, 255, 255, 0.9);
        border-color: rgba(21, 101, 192, 0.5);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(21, 101, 192, 0.22);
      }

      /* ════════════════════════════════════════
   BUILD BAR
   ════════════════════════════════════════ */
      #build-bar {
        flex-shrink: 0;
        padding: 10px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 50;
        transition: background 0.6s, border-color 0.6s;
      }
      #build-display {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 4px 10px;
        border-radius: 12px;
      }
      .input-bar-dark #build-display {
        background: rgba(255, 255, 255, 0.07);
      }
      .input-bar-light #build-display {
        background: rgba(0, 0, 0, 0.07);
      }

      #build-selected {
        flex: 1;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        align-items: center;
        min-height: 32px;
      }
      .build-sel-char {
        font-size: 22px;
        font-weight: 700;
        padding: 1px 5px;
        border-radius: 6px;
      }
      .input-bar-dark .build-sel-char {
        color: #e8d8ff;
      }
      .input-bar-light .build-sel-char {
        color: #1a237e;
      }

      #build-backspace {
        font-size: 20px;
        background: none;
        border: none;
        cursor: pointer;
        opacity: 0.5;
        padding: 4px 10px;
        border-radius: 8px;
        flex-shrink: 0;
        color: inherit;
        transition: opacity 0.15s;
      }
      #build-backspace:active {
        opacity: 1;
      }

      #build-tiles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .build-tile {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.12s, opacity 0.2s, box-shadow 0.15s;
        border: 1.5px solid transparent;
      }
      .build-tile:active {
        transform: scale(0.9);
      }
      .build-tile:disabled {
        opacity: 0.18;
        cursor: default;
        pointer-events: none;
      }

      .input-bar-dark .build-tile {
        background: rgba(70, 40, 140, 0.35);
        border-color: rgba(150, 120, 255, 0.3);
        color: #d8c8ff;
      }
      .input-bar-dark .build-tile:not(:disabled):hover {
        background: rgba(100, 70, 180, 0.5);
        border-color: rgba(180, 150, 255, 0.55);
        box-shadow: 0 4px 16px rgba(120, 80, 255, 0.35);
      }
      .input-bar-light .build-tile {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(100, 160, 220, 0.35);
        color: #1a237e;
      }
      .input-bar-light .build-tile:not(:disabled):hover {
        background: rgba(255, 255, 255, 0.95);
        border-color: rgba(21, 101, 192, 0.5);
        box-shadow: 0 4px 16px rgba(21, 101, 192, 0.22);
      }

      @keyframes build-shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      .build-shake {
        animation: build-shake 0.35s ease-out;
      }

      /* flash states */
      .choice-btn.correct-flash {
        animation: choice-correct 0.45s ease-out forwards;
      }
      .choice-btn.wrong-flash {
        animation: choice-wrong 0.4s ease-out;
      }
      @keyframes choice-correct {
        0% {
          background: rgba(76, 175, 80, 0.55);
          border-color: rgba(76, 175, 80, 0.8);
          box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.25);
          transform: scale(1.04);
        }
        60% {
          background: rgba(76, 175, 80, 0.25);
        }
        100% {
          background: inherit;
          border-color: inherit;
          box-shadow: none;
          transform: scale(1);
        }
      }
      @keyframes choice-wrong {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-7px);
        }
        60% {
          transform: translateX(7px);
        }
        80% {
          transform: translateX(-4px);
        }
      }

      /* ════════════════════════════════════════
   OVERLAYS
   ════════════════════════════════════════ */
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 20;
        backdrop-filter: blur(6px);
      }
      .overlay-dark {
        background: rgba(5, 2, 21, 0.85);
      }
      .overlay-light {
        background: rgba(240, 248, 255, 0.82);
      }

      .overlay-content {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 36px 28px;
        max-width: 440px;
        width: 100%;
      }

      .overlay-title {
        font-size: clamp(24px, 6vw, 40px);
        font-weight: 900;
        letter-spacing: 4px;
        margin-bottom: 6px;
      }
      .overlay-dark .overlay-title {
        color: #ede7f6;
      }
      .overlay-light .overlay-title {
        color: #1a237e;
      }

      .overlay-sub {
        font-size: 12px;
        letter-spacing: 3px;
        margin-bottom: 28px;
      }
      .overlay-dark .overlay-sub {
        color: rgba(180, 150, 255, 0.55);
      }
      .overlay-light .overlay-sub {
        color: rgba(21, 101, 192, 0.55);
      }

      .overlay-btn {
        padding: 14px 44px;
        border: none;
        border-radius: 10px;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 3px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .overlay-dark .overlay-btn {
        background: linear-gradient(135deg, #7e57c2, #512da8);
        color: #ede7f6;
        box-shadow: 0 4px 20px rgba(126, 87, 194, 0.45);
      }
      .overlay-dark .overlay-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(126, 87, 194, 0.6);
      }
      .overlay-light .overlay-btn {
        background: linear-gradient(135deg, #1565c0, #0d47a1);
        color: #e3f2fd;
        box-shadow: 0 4px 20px rgba(21, 101, 192, 0.4);
      }
      .overlay-light .overlay-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(21, 101, 192, 0.55);
      }
      .overlay-btn:active {
        transform: translateY(0) !important;
      }

      /* Wrong review */
      #overlay-gameover .overlay-content {
        max-height: 90vh;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(180, 150, 255, 0.3) transparent;
      }

      .wrong-review {
        margin-top: 24px;
        text-align: left;
        width: 100%;
      }

      .wrong-review-title {
        font-size: 10px;
        letter-spacing: 3px;
        color: rgba(180, 150, 255, 0.5);
        margin-bottom: 12px;
        text-align: center;
      }

      .wrong-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(180, 150, 255, 0.12);
        margin-bottom: 8px;
      }

      .wrong-item-word {
        font-size: 26px;
        color: #b39ddb;
        line-height: 1;
        min-width: 44px;
        text-align: center;
        flex-shrink: 0;
      }

      .wrong-item-info {
        flex: 1;
        min-width: 0;
      }

      .wrong-item-reading {
        font-size: 11px;
        color: rgba(180, 150, 255, 0.6);
        letter-spacing: 1px;
        margin-bottom: 2px;
      }

      .wrong-item-meaning {
        font-size: 13px;
        color: rgba(237, 231, 246, 0.85);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Game over score */
      .overlay-score-big {
        font-size: clamp(56px, 14vw, 92px);
        font-weight: 900;
        line-height: 1;
        margin-bottom: 4px;
      }
      .overlay-dark .overlay-score-big {
        color: #b39ddb;
      }
      .overlay-light .overlay-score-big {
        color: #1565c0;
      }

      .overlay-score-label {
        font-size: 11px;
        letter-spacing: 4px;
        margin-bottom: 36px;
      }
      .overlay-dark .overlay-score-label {
        color: rgba(180, 150, 255, 0.45);
      }
      .overlay-light .overlay-score-label {
        color: rgba(21, 101, 192, 0.45);
      }

      /* ════════════════════════════════════════
   MISS POPUP
   ════════════════════════════════════════ */
      #miss-popup {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 25;
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      #miss-popup.visible {
        opacity: 1;
        pointer-events: all;
      }
      .miss-card {
        position: relative;
        width: min(88%, 360px);
        border-radius: 24px;
        padding: 32px 28px 28px;
        text-align: center;
        background: linear-gradient(
          160deg,
          rgba(20, 10, 40, 0.97) 0%,
          rgba(40, 10, 20, 0.97) 100%
        );
        border: 1px solid rgba(255, 90, 90, 0.35);
        box-shadow: 0 0 0 1px rgba(255, 60, 60, 0.12),
          0 8px 40px rgba(0, 0, 0, 0.6), 0 0 60px rgba(200, 40, 40, 0.15),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
        transform: scale(0.88) translateY(16px);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #miss-popup.visible .miss-card {
        transform: scale(1) translateY(0);
      }
      .miss-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #ff6b6b;
        background: rgba(255, 80, 80, 0.12);
        border: 1px solid rgba(255, 80, 80, 0.25);
        border-radius: 20px;
        padding: 4px 14px;
        margin-bottom: 20px;
      }
      .miss-badge::before {
        content: "✕";
        font-size: 11px;
      }
      .miss-kanji {
        font-size: clamp(48px, 14vw, 72px);
        font-weight: 900;
        line-height: 1;
        margin-bottom: 10px;
        background: linear-gradient(
          135deg,
          #fff 30%,
          rgba(255, 180, 180, 0.85)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 20px rgba(255, 120, 120, 0.4));
      }
      .miss-reading {
        font-size: 22px;
        color: rgba(220, 180, 255, 0.9);
        margin-bottom: 4px;
        letter-spacing: 1px;
      }
      .miss-romaji {
        font-size: 13px;
        color: rgba(180, 150, 220, 0.6);
        letter-spacing: 2px;
        margin-bottom: 20px;
        text-transform: lowercase;
      }
      .miss-divider {
        width: 40px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 100, 100, 0.4),
          transparent
        );
        margin: 0 auto 20px;
      }
      .miss-meaning {
        font-size: 15px;
        color: rgba(240, 230, 255, 0.75);
        line-height: 1.5;
        margin-bottom: 28px;
        font-style: italic;
      }
      .miss-ok-btn {
        display: inline-block;
        padding: 13px 48px;
        border: none;
        border-radius: 50px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        cursor: pointer;
        background: linear-gradient(135deg, #ff6b6b, #c0392b);
        color: #fff;
        box-shadow: 0 4px 20px rgba(255, 80, 80, 0.4),
          0 0 0 0 rgba(255, 80, 80, 0.35);
        transition: transform 0.18s, box-shadow 0.18s;
        animation: miss-btn-pulse 2s infinite;
      }
      .miss-ok-btn:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 8px 30px rgba(255, 80, 80, 0.55);
        animation: none;
      }
      .miss-ok-btn:active {
        transform: scale(0.96);
      }
      @keyframes miss-btn-pulse {
        0%,
        100% {
          box-shadow: 0 4px 20px rgba(255, 80, 80, 0.4),
            0 0 0 0 rgba(255, 80, 80, 0.35);
        }
        50% {
          box-shadow: 0 4px 20px rgba(255, 80, 80, 0.4),
            0 0 0 10px rgba(255, 80, 80, 0);
        }
      }
      .miss-glow-ring {
        position: absolute;
        inset: -1px;
        border-radius: 24px;
        background: transparent;
        border: 1px solid transparent;
        background-clip: padding-box;
        pointer-events: none;
      }

      /* ════════════════════════════════════════
   PARTICLES
   ════════════════════════════════════════ */
      @keyframes particle-fly {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--dx), var(--dy)) scale(0);
          opacity: 0;
        }
      }
      .particle {
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        pointer-events: none;
        animation: particle-fly 0.65s ease-out forwards;
        z-index: 15;
      }
      @keyframes shake-area {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-5px);
        }
        40% {
          transform: translateX(5px);
        }
        60% {
          transform: translateX(-3px);
        }
        80% {
          transform: translateX(3px);
        }
      }
    </style>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="g-nav dark-nav" id="g-nav" style="transition: none">

        <svg

        >
          <polyline points="10,3 5,8 10,13" />

      <div class="g-nav-center">
        <span class="g-nav-title" id="round-label"></span>

    <!-- HISTORY PANEL -->
    <div id="history-panel">

      <div id="history-drawer">

          </div>
          <div class="h-stat wrong"><span id="hs-wrong">0</span>LẦN SAI</div>

        <div class="h-sort-bar">

    <!-- GAME AREA -->
    <div id="game-area" class="theme-space">
      <!-- background decoration layer -->

      <!-- START OVERLAY -->
      <div class="overlay overlay-dark" id="overlay-start">
        <div class="overlay-content">
          <h1 class="overlay-title">TỪ VỰNG RƠI</h1>
          <p class="overlay-sub">Chọn nghĩa · Bấm đáp án · Nền ngẫu nhiên</p>

          <div
            style="
              font-size: 12px;
              letter-spacing: 1px;
              margin-bottom: 28px;
              line-height: 2;
              opacity: 0.55;
              color: inherit;
            "
          >
            Từ vựng rơi từ trên xuống.<br />
            Bấm <strong style="opacity: 1">đúng nghĩa tiếng Việt</strong> để bắt

            Bỏ lỡ <strong style="color: #ef5350; opacity: 1">3 từ</strong> là
            thua!
          </div>
          <button class="overlay-btn" onclick="startGame()">BẮT ĐẦU</button>
          <button

            style="
              margin-top: 16px;
              background: none;
              border: none;

      <!-- ROUND COMPLETE OVERLAY -->

          <div class="overlay-score-big" id="round-score">0</div>

          <div
            id="round-wrong-hint"

              font-size: 11px;

      <!-- GAME OVER OVERLAY -->

          <div class="overlay-score-big" id="final-score">0</div>

          <button class="overlay-btn" onclick="showStart()">CHƠI LẠI</button>
          <div class="wrong-review" id="wrong-review" style="display: none">

      <!-- MISS POPUP -->

          <div class="miss-kanji" id="miss-kanji"></div>
          <div class="miss-reading" id="miss-reading"></div>
          <div class="miss-romaji" id="miss-romaji"></div>

          —

    <!-- BUILD BAR -->
    <div id="build-bar" class="input-bar-dark" style="display: none">
      <div id="build-display">

        <button id="build-backspace" onclick="onBuildBackspace()">⌫</button>
      </div>
      <div id="build-tiles"></div>
    </div>

    <script>
      /* ════════════════════════════════
   THEME CONFIG
   ════════════════════════════════ */
      const THEMES = {
        space: { dark: true, particle: ["#b39ddb", "#ce93d8", "#fff9c4"] },
        sky: { dark: false, particle: ["#1565c0", "#4fc3f7", "#ffffff"] },
        ocean: { dark: true, particle: ["#29b6f6", "#b3e5fc", "#80deea"] },
        desert: { dark: false, particle: ["#e65100", "#ffa726", "#fff9c4"] },
        meadow: { dark: false, particle: ["#2e7d32", "#66bb6a", "#ffeb3b"] },
      };

      let currentTheme = "space";

      function randomTheme() {
        const keys = Object.keys(THEMES);
        return keys[Math.floor(Math.random() * keys.length)];
      }

      function applyTheme(theme) {
        currentTheme = theme;
        const cfg = THEMES[theme];
        const variant = cfg.dark ? "dark" : "light";

        Object.keys(THEMES).forEach((t) =>
          gameArea.classList.remove("theme-" + t)
        );
        gameArea.classList.add("theme-" + theme);

        navEl.className = `g-nav ${variant}-nav`;
        choiceBarEl.className = `input-bar-${variant}`;
        buildBarEl.className = `input-bar-${variant}`;
        overlayStart.className = `overlay overlay-${variant}`;
        overlayGameover.className = `overlay overlay-${variant}`;
        overlayRound.className = `overlay overlay-${variant}`;

        buildBackground(theme);
      }

      /* ════════════════════════════════
   BACKGROUND BUILDERS
   ════════════════════════════════ */
      function buildBackground(theme) {
        bgLayer.innerHTML = "";

        if (theme === "space") buildSpace(bgLayer);
        if (theme === "sky") buildSky(bgLayer);
        if (theme === "ocean") buildOcean(bgLayer);
        if (theme === "desert") buildDesert(bgLayer);
        if (theme === "meadow") buildMeadow(bgLayer);
      }

      function buildSpace(layer) {
        // Nebula
        const neb = document.createElement("div");
        neb.className = "bg-nebula";
        layer.appendChild(neb);

        // Stars — 3 layers (tiny/small/medium)
        const starColors = ["#ffffff", "#cce0ff", "#ffeedd", "#e0d0ff"];
        for (let i = 0; i < 220; i++) {
          const s = document.createElement("div");
          s.className = "star";
          const r = Math.random();
          const size = r < 0.7 ? 1 : r < 0.92 ? 1.5 : r < 0.98 ? 2.5 : 3.5;
          const color =
            starColors[Math.floor(Math.random() * starColors.length)];
          s.style.cssText = `width:${size}px;height:${size}px;left:${
            Math.random() * 100
          }%;top:${Math.random() * 100}%;background:${color};--dur:${
            1.8 + Math.random() * 5
          }s;--delay:${Math.random() * 6}s;--max-op:${
            0.35 + Math.random() * 0.65
          };`;
          layer.appendChild(s);
        }

        // Shooting stars
        for (let i = 0; i < 4; i++) {
          const ss = document.createElement("div");
          ss.className = "shooting-star";
          const len = 80 + Math.random() * 100;
          ss.style.cssText = `width:${len}px;top:${
            4 + Math.random() * 38
          }%;left:${Math.random() * 50}%;--dur:${
            5 + Math.random() * 5
          }s;--delay:${i * 3 + Math.random() * 2}s;`;
          layer.appendChild(ss);
        }

        // Planet
        const planet = document.createElement("div");
        planet.className = "space-planet";
        const pSize = 38 + Math.random() * 28;
        planet.style.cssText = `width:${pSize}px;height:${pSize}px;top:${
          8 + Math.random() * 25
        }%;right:${
          10 + Math.random() * 15
        }%;background:radial-gradient(circle at 35% 35%,#b388ff,#4a148c);box-shadow:0 0 18px 6px rgba(150,80,255,0.4);`;
        layer.appendChild(planet);

        // Aurora
        const aurora = document.createElement("div");
        aurora.className = "space-aurora";
        layer.appendChild(aurora);
      }

      function buildSky(layer) {
        // Sun with rays
        const sunWrap = document.createElement("div");
        sunWrap.className = "sky-sun-wrap";
        const ray = document.createElement("div");
        ray.className = "sky-sun-ray";
        const core = document.createElement("div");
        core.className = "sky-sun-core";
        sunWrap.appendChild(ray);
        sunWrap.appendChild(core);
        layer.appendChild(sunWrap);

        // Mountain silhouette
        const mt = document.createElement("div");
        mt.className = "sky-mountain";
        mt.innerHTML = `<svg viewBox="0 0 400 100" preserveAspectRatio="none" width="100%" height="80" style="display:block">
          <path d="M0,100 L0,70 L40,30 L80,60 L120,20 L165,55 L200,15 L240,50 L280,25 L320,55 L360,35 L400,65 L400,100 Z" fill="rgba(10,30,60,0.25)"/>
          <path d="M0,100 L0,80 L50,55 L90,70 L130,45 L170,65 L210,40 L250,62 L290,48 L330,68 L370,52 L400,72 L400,100 Z" fill="rgba(10,25,50,0.35)"/>
        </svg>`;
        layer.appendChild(mt);

        // Clouds — layered with depth
        const cloudDefs = [
          { w: 230, h: 58, top: "7%", dur: "32s", delay: "0s", op: 0.95 },
          { w: 160, h: 44, top: "18%", dur: "44s", delay: "9s", op: 0.85 },
          { w: 280, h: 68, top: "30%", dur: "26s", delay: "16s", op: 0.78 },
          { w: 190, h: 52, top: "12%", dur: "50s", delay: "4s", op: 0.9 },
          { w: 120, h: 36, top: "24%", dur: "36s", delay: "22s", op: 0.7 },
          { w: 200, h: 55, top: "5%", dur: "40s", delay: "30s", op: 0.8 },
        ];
        cloudDefs.forEach((c) => {
          const cl = document.createElement("div");
          cl.className = "sky-cloud";
          cl.style.cssText = `width:${c.w}px;height:${c.h}px;top:${
            c.top
          };left:-${c.w + 30}px;animation-duration:${c.dur};animation-delay:${
            c.delay
          };opacity:${c.op};background:rgba(255,255,255,${
            c.op
